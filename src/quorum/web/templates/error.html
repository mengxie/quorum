{% extends "base.html" %}
{% block title %}{{ status }} | Quorum{% endblock %}
{% block main %}
<div class="message">
  <h1>{% if status == 404 %}Not found{% elif status == 403 %}Not allowed{% else %}That didn’t work{% endif %}</h1>
  <p>{{ message }}</p>
  <p><a href="{{ url_for('home') }}">Go to the start page</a></p>
</div>
{% endblock %}
